<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Lae Handicraft Market</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation bar -->
  <header>
    <h1>Lae Handicraft Market</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li> 
        <li><a href="products.html">Products</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Page content -->
  <main>
    <h2>Gallery</h2>

    <div class="gallery">
      <section>
        <h2>Paintings</h2>
        <figure>
          <img src="images/paintings.jpg" alt="Paintings">
        </figure>
      </section>

      <section>
        <h2>Bilums</h2>
        <figure>
          <img src="images/bilums.jpg" alt="Bilum">
        </figure>
      </section>

      <section>
        <h2>Necklaces</h2>
        <figure>
          <img src="images/necklaces.jpg" alt="Necklaces">
        </figure>
      </section>

      <section>
        <h2>Baskets</h2>
        <figure>
          <img src="images/baskets.jpg" alt="Basket">
        </figure>
      </section>

      <section>
        <h2>Wood Carvings</h2>
        <figure>
          <img src="images/carvings.jpg" alt="Wood Carving">
        </figure>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Lae Handicraft Market</p>
  </footer>

  <!-- Script -->
  <script>
    // Toggle expand on click for gallery images
    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        img.classList.toggle('expanded');
      });
    });
  </script>

</body>
</html>
